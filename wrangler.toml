# Cloudflare Workers config for the Next.js app built via @opennextjs/cloudflare.
# Secrets (DATABASE_URL, SESSION_SECRET, BASIC_AUTH_*, MODAL_API_URL, etc.) are
# set via `wrangler secret put <NAME>` — never checked in.

name = "rej-studio"
main = ".open-next/worker.js"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

# Static assets produced by the OpenNext build.
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
DEPLOY_TARGET = "cloudflare"
# Cloudflare has no Python runtime — compute MUST go through Modal.
COMPUTE_BACKEND = "modal"
