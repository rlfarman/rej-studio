version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    # Only propose versions a week old: pnpm refuses anything under a day
    # (minimumReleaseAge), and the wait lets a compromised release get caught
    # and yanked first. Security updates skip the cooldown.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    # A dependency matching several groups lands in the first one.
    groups:
      base-ui:
        patterns:
          - '@base-ui/*'
      sentry:
        patterns:
          - '@sentry/*'
      storybook:
        patterns:
          - 'storybook'
          - '@storybook/*'
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
      types:
        patterns:
          - '@types/*'
      eslint:
        patterns:
          - 'eslint'
          - 'eslint-*'
          - '@eslint/*'
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - 'react-hook-form'
          - '@hookform/*'
      tailwind:
        patterns:
          - 'tailwindcss'
          - 'tailwindcss-*'
          - '@tailwindcss/*'
          - 'tailwind-merge'
      tanstack:
        patterns:
          - '@tanstack/*'
      dev-dependencies:
        dependency-type: 'development'
        exclude-patterns:
          - 'eslint*'
          - '@eslint/*'
          - 'tailwindcss*'
          - '@tailwindcss/*'
          - '@tanstack/*'
          - 'storybook'
          - '@storybook/*'
          - 'vitest'
          - '@vitest/*'

  - package-ecosystem: 'github-actions'
    # '/' covers .github/workflows; the local composite action pins its own
    # actions, so it's listed too.
    directories:
      - '/'
      - '/.github/actions/*'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - '*'
