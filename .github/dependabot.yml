version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    # Only propose versions a week old: pnpm refuses anything under a day
    # (minimumReleaseAge), and the wait lets a compromised release get caught
    # and yanked first. Security updates skip the cooldown.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    # A dependency matching several groups lands in the first one.
    groups:
      base-ui:
        patterns:
          - '@base-ui/*'
      sentry:
        patterns:
          - '@sentry/*'
      storybook:
        patterns:
          - 'storybook'
          - '@storybook/*'
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
      types:
        patterns:
          - '@types/*'
      eslint:
        patterns:
          - 'eslint'
          - 'eslint-*'
          - '@eslint/*'
      drizzle:
        patterns:
          - 'drizzle-orm'
          - 'drizzle-kit'
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - 'react-hook-form'
          - '@hookform/*'
      next:
        patterns:
          - 'next'
          - 'next-*'
          - '@next/*'
          - 'eslint-config-next'
      tailwind:
        patterns:
          - 'tailwindcss'
          - 'tailwindcss-*'
          - '@tailwindcss/*'
          - 'tailwind-merge'
          - 'prettier-plugin-tailwindcss'
      tanstack:
        patterns:
          - '@tanstack/*'
      dev-dependencies:
        dependency-type: 'development'
        exclude-patterns:
          - 'eslint*'
          - '@eslint/*'
          - 'drizzle-*'
          - '@next/*'
          - 'tailwindcss*'
          - '@tailwindcss/*'
          - 'prettier-plugin-*'
          - '@tanstack/*'
          - 'storybook'
          - '@storybook/*'
          - 'vitest'
          - '@vitest/*'

  - package-ecosystem: 'uv'
    # Python dependencies (runtime, dev and the Modal deploy client) are
    # declared in the root pyproject.toml and locked in uv.lock; Dependabot
    # updates both.
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # Released in lockstep; updating them separately breaks resolution.
      opentelemetry:
        patterns:
          - 'opentelemetry-*'

  - package-ecosystem: 'github-actions'
    # '/' covers .github/workflows; the local composite action pins its own
    # actions, so it's listed too.
    directories:
      - '/'
      - '/.github/actions/*'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - '*'
