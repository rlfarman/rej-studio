name: Lighthouse

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.editorconfig'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.editorconfig'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The action reports through LHCI_GITHUB_APP_TOKEN and temporary public
# storage; it doesn't use GITHUB_TOKEN to write anything.
permissions:
  contents: read

jobs:
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup

      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          # Lighthouse audits only `/`, a prerendered static page, and the
          # build never queries the database, so neither step needs
          # production credentials. env.ts only checks the scheme.
          DATABASE_URL: postgres://ci:ci@127.0.0.1:1/ci
          # Required by env.ts production validation but not exercised in CI.
          COMPUTE_BACKEND: modal
          MODAL_API_URL: https://placeholder.modal.run
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          configPath: './.lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
          DATABASE_URL: postgres://ci:ci@127.0.0.1:1/ci
          COMPUTE_BACKEND: modal
          MODAL_API_URL: https://placeholder.modal.run
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
