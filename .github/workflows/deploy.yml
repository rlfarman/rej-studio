name: Deploy

# Deploys the Worker (rej-studio) from main, the only way it should be
# deployed once the cutover lands: from a laptop it is too easy to build
# against the 24-gene sample, report an unknown commit, or ship without
# source maps. Everything the build needs comes from here instead.
#
# Repository variables (not secrets; each is public or harmless):
#   CLOUDFLARE_ACCOUNT_ID  the account that owns the Worker
#   VITE_GENE_DATA_URL     the published corpus version, e.g. .../v1
#   VITE_SENTRY_DSN        where the browser reports errors (public)
#   SENTRY_ORG, SENTRY_PROJECT
# Repository secrets:
#   CLOUDFLARE_API_TOKEN   account token "rej-studio GitHub Actions deploy":
#                          the Edit Cloudflare Workers template plus D1 Edit
#   SENTRY_AUTH_TOKEN      uploads the browser's source maps; without it the
#                          build skips the upload and still deploys
#
# The Worker's own secrets (the passcode, BETTER_AUTH_SECRET, MCP_TOKENS…)
# live on the Worker and are not touched by a deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, and never cancel one halfway: a cancelled deploy can
# leave migrations applied for code that is not live yet.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://rej-studio.rejstudio.workers.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup

      # Schema before code: the new code may read tables the old schema lacks,
      # and every migration so far only adds. wrangler skips its confirmation
      # prompt in CI.
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 migrations apply AUTH_DB --remote

      # cf:deploy refuses a build without VITE_GENE_DATA_URL (it would serve
      # the 24-gene sample), then builds and runs `wrangler deploy`.
      - name: Build and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          VITE_GENE_DATA_URL: ${{ vars.VITE_GENE_DATA_URL }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          GIT_COMMIT_SHA: ${{ github.sha }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: pnpm cf:deploy

      # The new version answers. Liveness only: the deep check needs a token,
      # and uptime.yml runs that one on a schedule.
      - name: Check it answers
        run: |
          for attempt in 1 2 3 4 5; do
            status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 \
              https://rej-studio.rejstudio.workers.dev/api/health || true)
            if [ "$status" = "200" ]; then
              echo "health: 200"
              exit 0
            fi
            echo "health: $status (attempt $attempt)"
            sleep 5
          done
          exit 1
