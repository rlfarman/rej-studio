name: Deploy Modal

on:
  push:
    branches: [main]
    paths:
      - 'python/**'
      - 'modal/**'
      - '.github/workflows/modal-deploy.yml'
  workflow_dispatch:

concurrency:
  group: modal-deploy
  cancel-in-progress: false

permissions:
  contents: write # needed to push the deploy tag

jobs:
  deploy:
    name: Deploy to Modal
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: python/requirements.txt

      - name: Install Modal
        run: pip install modal

      - name: Deploy
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          GIT_SHA: ${{ github.sha }}
        run: modal deploy modal/app.py

      - name: Tag deploy
        # Tag every successful Modal deploy with the timestamp + short SHA so
        # we can correlate prod Modal behavior with a specific commit later.
        # Format: modal-YYYYMMDD-HHMMSS-<short-sha>. These are lightweight tags.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          short="${GITHUB_SHA:0:7}"
          tag="modal-$(date -u +%Y%m%d-%H%M%S)-${short}"
          git tag "$tag" "$GITHUB_SHA"
          git push origin "$tag"
          echo "Tagged deploy as $tag"
