name: Deploy Modal

on:
  push:
    branches: [main]
    paths:
      - 'python/**'
      - 'modal/**'
      # Dependency or Python version changes rebuild the image (it installs
      # from uv.lock), so they deploy too.
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - '.github/workflows/modal-deploy.yml'
  workflow_dispatch:

concurrency:
  group: modal-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Gate: production compute only ever ships from main, and only when the
  # Python suite passes. workflow_dispatch from a branch would otherwise
  # deploy unreviewed code straight to prod.
  guard:
    name: Deployable ref
    runs-on: ubuntu-latest
    steps:
      - name: Require main
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Modal deploys only run from main (got ${GITHUB_REF})." >&2
            exit 1
          fi

  test:
    name: Pytest
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.8'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install runtime + dev + deploy deps
        # The Modal client (deploy group) is needed for the modal/app.py tests.
        run: uv sync --frozen --group deploy

      - name: Pytest
        run: uv run --frozen --no-sync pytest

  deploy:
    name: Deploy to Modal
    needs: test
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write # the Tag deploy step creates a tag ref
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.8'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        # Runtime deps (app.py imports fastapi/pydantic while `modal deploy`
        # loads it) plus the pinned Modal client from the deploy group.
        run: uv sync --frozen --no-dev --group deploy

      - name: Sync runtime secret
        # One Modal secret carries everything the containers read at runtime:
        # the shared API token the Next.js server authenticates with, plus
        # optional observability config. --force updates it in place, so a
        # rotated GitHub secret reaches prod on the next deploy.
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MODAL_JOB_API_TOKEN: ${{ secrets.MODAL_JOB_API_TOKEN }}
          MODAL_SENTRY_DSN: ${{ secrets.MODAL_SENTRY_DSN }}
        run: |
          set -euo pipefail
          if [ -z "${MODAL_JOB_API_TOKEN}" ]; then
            echo "MODAL_JOB_API_TOKEN is not set — the /jobs endpoints would be public." >&2
            exit 1
          fi
          args=(secret create rej-studio-runtime "JOB_API_TOKEN=${MODAL_JOB_API_TOKEN}")
          if [ -n "${MODAL_SENTRY_DSN}" ]; then
            args+=("SENTRY_DSN=${MODAL_SENTRY_DSN}")
          fi
          uv run --frozen --no-sync modal "${args[@]}" --force

      - name: Deploy
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          GIT_SHA: ${{ github.sha }}
          # Pin the image builder instead of inheriting the workspace default.
          # The image needs Image.uv_sync and Python 3.14, which both require
          # builder 2025.06+; 2026.10 is the newest stable version the pinned
          # Modal client (modal==1.6.4) accepts. The client reads
          # MODAL_IMAGE_BUILDER_VERSION before the workspace setting. Changing
          # this rebuilds the image from scratch on the next deploy.
          MODAL_IMAGE_BUILDER_VERSION: '2026.10'
        run: uv run --frozen --no-sync modal deploy modal/app.py

      - name: Smoke check
        # The deploy isn't done until the app actually answers. /health is
        # public and says nothing sensitive, so no token is needed.
        # MODAL_API_URL is a repository variable (Settings → Variables).
        env:
          MODAL_API_URL: ${{ vars.MODAL_API_URL }}
        run: |
          set -euo pipefail
          if [ -z "${MODAL_API_URL}" ]; then
            echo "::warning::MODAL_API_URL variable is not set — skipping the post-deploy smoke check."
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            if curl -fsS --max-time 30 "${MODAL_API_URL}/health"; then
              echo
              echo "Smoke check passed."
              exit 0
            fi
            echo "Attempt ${attempt} failed (cold start?) — retrying in 10s." >&2
            sleep 10
          done
          echo "::error::${MODAL_API_URL}/health did not respond after the deploy." >&2
          exit 1

      - name: Tag deploy
        # Tag every successful Modal deploy with the timestamp + short SHA so
        # we can correlate prod Modal behavior with a specific commit later.
        # Format: modal-YYYYMMDD-HHMMSS-<short-sha>. These are lightweight tags.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          short="${GITHUB_SHA:0:7}"
          tag="modal-$(date -u +%Y%m%d-%H%M%S)-${short}"
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA"
          echo "Tagged deploy as $tag"
