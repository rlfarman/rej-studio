name: Deploy Modal

on:
  push:
    branches: [main]
    paths:
      - 'python/**'
      - 'modal/**'
      - '.github/workflows/modal-deploy.yml'
  workflow_dispatch:

concurrency:
  group: modal-deploy
  cancel-in-progress: false

permissions:
  contents: write # needed to push the deploy tag

jobs:
  deploy:
    name: Deploy to Modal
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            python/requirements.txt
            modal/requirements.txt

      - name: Install dependencies
        # Pinned Modal client, plus the runtime lock because app.py imports
        # fastapi/pydantic while `modal deploy` loads it.
        run: pip install -r python/requirements.txt -r modal/requirements.txt

      - name: Deploy
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          GIT_SHA: ${{ github.sha }}
        run: modal deploy modal/app.py

      - name: Tag deploy
        # Tag every successful Modal deploy with the timestamp + short SHA so
        # we can correlate prod Modal behavior with a specific commit later.
        # Format: modal-YYYYMMDD-HHMMSS-<short-sha>. These are lightweight tags.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          short="${GITHUB_SHA:0:7}"
          tag="modal-$(date -u +%Y%m%d-%H%M%S)-${short}"
          git tag "$tag" "$GITHUB_SHA"
          git push origin "$tag"
          echo "Tagged deploy as $tag"
