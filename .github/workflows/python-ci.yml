name: Python CI

on:
  pull_request:
    paths:
      - 'python/**'
      - 'modal/**'
      - 'pyproject.toml'
      - '.github/workflows/python-ci.yml'
  push:
    branches: [main]
    paths:
      - 'python/**'
      - 'modal/**'
      - 'pyproject.toml'
      - '.github/workflows/python-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff (lint + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install ruff
        run: pip install -r python/requirements-dev.txt
      - name: Ruff format check
        run: ruff format --check python/ modal/
      - name: Ruff lint
        run: ruff check python/ modal/

  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: python/requirements.txt
      - name: Install deps
        run: |
          pip install -r python/requirements.txt
          pip install -r python/requirements-dev.txt
      - run: pytest

  pyright:
    name: Pyright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: python/requirements.txt
      - name: Install deps
        # Pyright needs the runtime deps to resolve third-party imports
        # (fastapi, pydantic, modal) or it'll flag every import as unknown.
        run: |
          pip install -r python/requirements.txt
          pip install -r python/requirements-dev.txt
          pip install modal
      - name: Pyright
        run: pyright python/ modal/
