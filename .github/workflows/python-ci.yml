name: Python CI

on:
  pull_request:
    paths:
      - 'python/**'
      - 'modal/**'
      - 'pyproject.toml'
      - '.github/workflows/python-ci.yml'
  push:
    branches: [main]
    paths:
      - 'python/**'
      - 'modal/**'
      - 'pyproject.toml'
      - '.github/workflows/python-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff (lint + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install dev tools
        # The dev lock holds only ruff/pyright/pytest (constrained to the
        # runtime lock), so linting doesn't need the runtime deps.
        run: pip install -r python/requirements-dev.txt
      - name: Ruff format check
        run: ruff format --check python/ modal/
      - name: Ruff lint
        run: ruff check python/ modal/

  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            python/requirements.txt
            python/requirements-dev.txt
      - name: Install deps
        run: pip install -r python/requirements.txt -r python/requirements-dev.txt
      - run: pytest
      - name: Upload Python coverage to Codecov
        if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/python-lcov.info
          flags: python
          fail_ci_if_error: false

  pyright:
    name: Pyright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            python/requirements.txt
            python/requirements-dev.txt
            modal/requirements.txt
      - name: Install deps
        # Pyright needs the runtime deps to resolve third-party imports
        # (fastapi, pydantic, modal) or it'll flag every import as unknown.
        run: pip install -r python/requirements.txt -r python/requirements-dev.txt -r modal/requirements.txt
      - name: Pyright
        run: pyright python/ modal/
