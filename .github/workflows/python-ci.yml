name: Python CI

on:
  pull_request:
    paths:
      - 'python/**'
      - 'modal/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - '.github/workflows/python-ci.yml'
  push:
    branches: [main]
    paths:
      - 'python/**'
      - 'modal/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - '.github/workflows/python-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# uv reads the Python version from .python-version (3.14). --frozen installs
# exactly what uv.lock pins and never rewrites it; the `lock` job runs
# `uv lock --check` so a pyproject.toml edit without re-locking fails CI.
env:
  UV_VERSION: '0.13.8'

jobs:
  lock:
    name: uv.lock up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Check uv.lock matches pyproject.toml
        run: uv lock --check

  ruff:
    name: Ruff (lint + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dev tools
        # Linting doesn't need the runtime deps, only the dev group.
        run: uv sync --frozen --only-group dev
      - name: Ruff format check
        run: uv run --frozen --no-sync ruff format --check python/ modal/
      - name: Ruff lint
        run: uv run --frozen --no-sync ruff check python/ modal/

  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install runtime + dev + deploy deps
        # The deploy group brings the Modal client, which the modal/app.py
        # tests import. Without it those tests skip and the web endpoint
        # (auth, job lifecycle, error mapping) goes untested.
        run: uv sync --frozen --group deploy
      - run: uv run --frozen --no-sync pytest

  pyright:
    name: Pyright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install deps
        # Pyright needs the runtime deps and the Modal client (deploy group)
        # to resolve imports in python/ and modal/.
        run: uv sync --frozen --group deploy
      - name: Pyright
        # Config (Python version, .venv, include paths) is in pyproject.toml.
        run: uv run --frozen --no-sync pyright
