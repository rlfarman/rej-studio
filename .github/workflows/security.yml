name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly scan (Monday 08:00 UTC) catches newly-disclosed CVEs in pinned deps.
    - cron: '0 8 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # `pnpm audit` hits the npm registry's advisory DB directly, independent of
  # GitHub's own Dependabot alerts. Fails on high+ so serious CVEs block
  # merges.
  npm-audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        # Only fail on advisories affecting prod deps; dev-dep CVEs are noisy
        # and rarely ship to users. Blocks on high+: the remaining moderate
        # advisories need upstream major releases, so failing on them would
        # leave this check permanently red. Dependabot still reports them.
        run: pnpm audit --prod --audit-level high

  # pip-audit uses PyPI's advisory DB (PYSEC + OSV feed) — no GitHub code
  # scanning. Audits the runtime dependencies (what the Modal image installs)
  # exported from uv.lock with hashes, so pip-audit checks the exact pins
  # without resolving or installing anything. (`uv audit` exists but is still
  # experimental.)
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.8'
      - name: Export runtime dependencies from uv.lock
        run: uv export --frozen --no-dev --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
      - name: Audit runtime dependencies
        run: uvx --from pip-audit==2.10.1 pip-audit -r "$RUNNER_TEMP/requirements.txt" --strict --disable-pip

  # SBOM generation — attached as a workflow artifact on every main push.
  # Gives us a reproducible snapshot of what was shipped, usable for
  # compliance audits or CVE triage after the fact.
  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26'
          cache: 'pnpm'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.8'
      - run: pnpm install --frozen-lockfile
      - name: Generate npm SBOM (CycloneDX)
        # cdxgen supports pnpm natively; cyclonedx-npm only works with npm's lockfile
        run: npx --yes @cyclonedx/cdxgen -o sbom-npm.cdx.json -t js --no-recurse
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
      - name: Generate Python SBOM (CycloneDX)
        # Runtime dependencies (what the Modal image installs), from uv.lock.
        run: |
          uv export --frozen --no-dev --no-emit-project --no-hashes --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uvx --from cyclonedx-bom==8.0.1 cyclonedx-py requirements "$RUNNER_TEMP/requirements.txt" -o sbom-python.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: sbom-*.cdx.json
          retention-days: 90
