name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly scan (Monday 08:00 UTC) catches newly-disclosed CVEs in pinned deps.
    - cron: '0 8 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # `pnpm audit` hits the npm registry's advisory DB directly, independent of
  # GitHub's own Dependabot alerts. Fails on high+ so serious CVEs block
  # merges.
  npm-audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      - name: Audit production dependencies
        # Only fail on advisories affecting prod deps; dev-dep CVEs are noisy
        # and rarely ship to users. Blocks on high+: the remaining moderate
        # advisories need upstream major releases, so failing on them would
        # leave this check permanently red. Dependabot still reports them.
        run: pnpm audit --prod --audit-level high

  # Diffs the dependency graph between the PR's base and head and fails on
  # newly added packages with high+ advisories. Covers pnpm-lock.yaml and
  # rust/Cargo.lock, and catches what the PR introduces before it merges.
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  # cargo-deny for the Rust optimizer: RustSec advisories plus the license,
  # ban and source policy in rust/deny.toml. The weekly schedule matters as
  # much as the PR run, because advisories land against versions already in
  # Cargo.lock with no commit here to trigger CI.
  cargo-deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # cargo-deny runs `cargo metadata`, so it needs the pinned toolchain.
      - name: Install Rust
        working-directory: rust
        run: rustup toolchain install
      # Prebuilt, checksum-verified binary: compiling cargo-deny from source
      # would take minutes on every cache miss.
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-deny@0.21.0
      - name: Check advisories, bans, licenses and sources
        working-directory: rust
        run: cargo deny check

  # SBOM generation — attached as a workflow artifact on every main push.
  # Gives us a reproducible snapshot of what was shipped, usable for
  # compliance audits or CVE triage after the fact.
  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      - name: Generate npm SBOM (CycloneDX)
        # cdxgen supports pnpm natively; cyclonedx-npm only works with npm's lockfile
        run: npx --yes @cyclonedx/cdxgen@12.9.2 -o sbom-npm.cdx.json -t js --no-recurse
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom-*.cdx.json
          retention-days: 90
