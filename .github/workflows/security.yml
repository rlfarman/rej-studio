name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly scan (Monday 08:00 UTC) catches newly-disclosed CVEs in pinned deps
    - cron: '0 8 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  osv-scanner:
    name: OSV Scanner
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.0.0
    with:
      scan-args: |-
        --lockfile=pnpm-lock.yaml
        --lockfile=requirements.txt:python/requirements.txt
    permissions:
      contents: read
      security-events: write
      actions: read
