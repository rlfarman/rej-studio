name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly scan (Monday 08:00 UTC) catches newly-disclosed CVEs in pinned deps.
    - cron: '0 8 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # `pnpm audit` hits the npm registry's advisory DB directly, independent of
  # GitHub's own Dependabot alerts. Fails on high+ so serious CVEs block
  # merges.
  npm-audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v4.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        # Only fail on advisories affecting prod deps; dev-dep CVEs are noisy
        # and rarely ship to users. Blocks on high+: the remaining moderate
        # advisories need upstream major releases, so failing on them would
        # leave this check permanently red. Dependabot still reports them.
        run: pnpm audit --prod --audit-level high

  # pip-audit uses PyPI's advisory DB (PYSEC + OSV feed) — no GitHub code
  # scanning. Runs against runtime + Modal requirements.
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit python/requirements.txt
        run: pip-audit -r python/requirements.txt --strict

  # SBOM generation — attached as a workflow artifact on every main push.
  # Gives us a reproducible snapshot of what was shipped, usable for
  # compliance audits or CVE triage after the fact.
  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v4.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'pnpm'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: pnpm install --frozen-lockfile
      - name: Generate npm SBOM (CycloneDX)
        # cdxgen supports pnpm natively; cyclonedx-npm only works with npm's lockfile
        run: npx --yes @cyclonedx/cdxgen -o sbom-npm.cdx.json -t js --no-recurse
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
      - name: Generate Python SBOM (CycloneDX)
        run: |
          pip install cyclonedx-bom
          cyclonedx-py requirements python/requirements.txt -o sbom-python.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom-*.cdx.json
          retention-days: 90
