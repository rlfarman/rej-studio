name: Stale

on:
  schedule:
    # Daily at 09:00 UTC
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@5bef64f19d7facfb25b37b414482c7164d639639 # v9.1.0
        with:
          days-before-stale: 30
          days-before-close: 14
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'
          exempt-issue-labels: 'pinned,security,roadmap'
          exempt-pr-labels: 'pinned,security,wip'
          exempt-draft-pr: true
          stale-issue-message: >
            This issue has been inactive for 30 days and will be closed in 14 days
            if there's no further activity. Comment to keep it open.
          stale-pr-message: >
            This PR has been inactive for 30 days and will be closed in 14 days
            if there's no further activity. Push a commit or comment to keep it open.
          close-issue-message: >
            Closing due to inactivity. Reopen if this is still relevant.
          close-pr-message: >
            Closing due to inactivity. Reopen and rebase if you'd like to continue.
          operations-per-run: 100
