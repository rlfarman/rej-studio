name: Rust CI

# The optimizer exists twice: python/algorithm.py and the Rust port in rust/.
# These jobs are what keep the two in step — the parity tests compare the port
# against fixtures generated by the real DNAChisel, so a change to one
# implementation that is not mirrored in the other fails here rather than
# silently designing different sequences.
#
# Filters by path inside the workflow (like Python CI and DB CI): a workflow
# skipped by `on.paths` leaves its required checks pending forever, while a
# job skipped by `if:` reports success.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned so a toolchain release cannot change the committed .wasm out from
  # under the digest check below.
  RUST_VERSION: '1.100.0'
  WASM_TARGET: wasm32-unknown-unknown

jobs:
  changes:
    name: Detect Rust Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # paths-filter lists a PR's files through the API
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            rust:
              - 'rust/**'
              - 'public/optimizer/**'
              - 'scripts/build-optimizer-wasm.sh'
              - 'scripts/gen-codon-tables.py'
              - 'scripts/gen-parity-fixtures.py'
              - 'scripts/wasm-harness.mjs'
              - 'scripts/wasm-smoke.mjs'
              # The Python optimizer is the thing the port is checked against,
              # so a change there has to re-run parity too.
              - 'python/**'
              - '.github/workflows/rust-ci.yml'

  test:
    name: Tests, format and lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal \
            --component clippy,rustfmt
          rustup default "${RUST_VERSION}"

      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          workspaces: rust

      # Formatting and lint first: they fail in seconds and their output says
      # exactly what to change.
      - name: Format
        working-directory: rust
        run: cargo fmt --all -- --check

      - name: Lint
        working-directory: rust
        run: cargo clippy --all-targets -- -D warnings

      # The parity suite. Release mode because the fixtures include real genes
      # of a few thousand bases, which take minutes unoptimized.
      - name: Tests
        working-directory: rust
        run: cargo test --release

  wasm:
    name: WebAssembly build and smoke test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup default "${RUST_VERSION}"
          rustup target add "${WASM_TARGET}"

      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          workspaces: rust
          key: wasm

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # public/optimizer/rej-optimizer.wasm is committed so `pnpm build` needs
      # no Rust toolchain. This rebuilds and compares digests, so a stale asset
      # fails rather than shipping an optimizer that no longer matches rust/.
      - name: Committed .wasm matches the source
        run: ./scripts/build-optimizer-wasm.sh --check

      # Runs the built module through Node against the same fixtures: the
      # designs must match Python's, progress must arrive and advance, and a
      # bad request must come back as an error rather than a crash.
      - name: Smoke test
        run: node scripts/wasm-smoke.mjs rust/target/${{ env.WASM_TARGET }}/release/rej_optimizer.wasm
