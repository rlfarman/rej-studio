name: Rust CI

# The optimizer exists twice: python/algorithm.py and the Rust port in rust/.
# These jobs are what keep the two in step — the parity tests compare the port
# against fixtures generated by the real DNAChisel, so a change to one
# implementation that is not mirrored in the other fails here rather than
# silently designing different sequences.
#
# Filters by path inside the workflow (like Python CI and DB CI): a workflow
# skipped by `on.paths` leaves its required checks pending forever, while a
# job skipped by `if:` reports success.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The Rust version, components and wasm target all come from
# rust/rust-toolchain.toml, so CI and local builds cannot drift apart. Bump
# the toolchain there, not here.
env:
  WASM_TARGET: wasm32-unknown-unknown

jobs:
  changes:
    name: Detect Rust Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # paths-filter lists a PR's files through the API
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      wasm_source: ${{ steps.filter.outputs.wasm_source }}
      wasm_asset: ${{ steps.filter.outputs.wasm_asset }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            rust:
              - 'rust/**'
              - 'public/optimizer/**'
              - 'scripts/build-optimizer-wasm.sh'
              - 'scripts/gen-codon-tables.py'
              - 'scripts/gen-parity-fixtures.py'
              - 'scripts/wasm-harness.mjs'
              - 'scripts/wasm-smoke.mjs'
              # The Python optimizer is the thing the port is checked against,
              # so a change there has to re-run parity too.
              - 'python/**'
              - 'scripts/check-wasm-asset.mjs'
              # Generated from the crate by `cargo run --example`, so a hand
              # edit to either has to face the regeneration check below.
              - 'src/features/design-tool/utils/codon-preference.generated.ts'
              - 'src/lib/bio/sequence-utils.ts'
              - 'src/lib/bio/sequence-utils.wggw-parity.test.ts'
              - '.github/workflows/rust-ci.yml'
            # What actually compiles into the .wasm. Tests and fixtures are
            # excluded: they change expectations, not the shipped module.
            wasm_source:
              - 'rust/rust-toolchain.toml'
              - 'rust/Cargo.toml'
              - 'rust/Cargo.lock'
              - 'rust/optimizer/Cargo.toml'
              - 'rust/optimizer/src/**'
            wasm_asset:
              - 'public/optimizer/**'
              - 'src/features/design-tool/workers/optimizer-asset.generated.ts'

  test:
    name: Rust tests, format and lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No arguments: installs exactly what rust/rust-toolchain.toml names.
      - name: Install Rust
        working-directory: rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          workspaces: rust

      # Formatting and lint first: they fail in seconds and their output says
      # exactly what to change.
      - name: Format
        working-directory: rust
        run: cargo fmt --all -- --check

      - name: Lint
        working-directory: rust
        run: cargo clippy --all-targets -- -D warnings

      # The wasm ABI in optimizer/src/lib.rs — the crate's only unsafe code —
      # is cfg(target_arch = "wasm32"), so the native run above never sees
      # it. Lint the browser build too, or its SAFETY comments go unchecked.
      - name: Lint the WebAssembly build
        working-directory: rust
        run: cargo clippy --lib --target "${WASM_TARGET}" -- -D warnings

      # The parity suite. Release mode because the fixtures include real genes
      # of a few thousand bases, which take minutes unoptimized.
      - name: Tests
        working-directory: rust
        run: cargo test --release

  wasm:
    name: WebAssembly build and smoke test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The gap the byte comparison was meant to close: optimizer source
      # edited, committed .wasm left behind. Caught by what the PR touches
      # rather than by rebuilding, so it cannot fail for a host difference.
      - name: Optimizer source changed without rebuilding the asset
        if: >-
          needs.changes.outputs.wasm_source == 'true' &&
          needs.changes.outputs.wasm_asset != 'true'
        run: |
          echo "::error::rust/optimizer/src changed but the committed" \
            ".wasm did not. Run 'pnpm wasm:build' and commit" \
            "public/optimizer/rej-optimizer.wasm together with" \
            "src/features/design-tool/workers/optimizer-asset.generated.ts."
          exit 1

      - name: Install Rust
        working-directory: rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          workspaces: rust
          key: wasm

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # public/optimizer/rej-optimizer.wasm is committed so `pnpm build` needs
      # no Rust toolchain, and the worker cache-busts it with the digest in
      # optimizer-asset.generated.ts. This checks the two still agree.
      #
      # There is no rebuild-and-compare-bytes step: the same source, toolchain
      # and lockfile produce different .wasm bytes on different hosts, so that
      # check failed on honest commits. The two steps below cover the same
      # ground without depending on reproducible builds — the committed module
      # has to pass the fixtures, and a source change has to touch the asset.
      - name: Committed asset is self-consistent
        run: node scripts/check-wasm-asset.mjs

      # The module users actually download, run through Node against the
      # fixtures: designs must match Python's, progress must arrive and
      # advance, and a bad request must come back as an error, not a crash.
      # A stale asset fails here as soon as it designs a different sequence.
      - name: Smoke test the committed module
        run: node scripts/wasm-smoke.mjs public/optimizer/rej-optimizer.wasm

      # And the same from a fresh build, so the source in rust/ is known to
      # still produce a working module even when the asset is untouched.
      - name: Smoke test a fresh build
        run: |
          ./scripts/build-optimizer-wasm.sh
          node scripts/wasm-smoke.mjs \
            "rust/target/${WASM_TARGET}/release/rej_optimizer.wasm"

      # Two files are generated from the crate's own data and committed: the
      # codon preferences the charts draw (written by the build script above)
      # and the WGGW answers the TypeScript parity test compares against.
      # Neither is reachable from the .wasm — an export only these generators
      # call would be download weight for every visitor — so this job, which
      # has the toolchain, is what keeps them from going stale.
      - name: Regenerate what the crate generates
        working-directory: rust
        run: cargo run --release --quiet --example wggw-reference

      - name: Generated files are in step with the crate
        run: |
          files=(
            src/features/design-tool/utils/codon-preference.generated.ts
            rust/optimizer/tests/fixtures/wggw_reference.json
          )
          if ! git diff --exit-code -- "${files[@]}"; then
            echo "::error::a file generated from the crate is stale. Run" \
              "'pnpm wasm:build' and" \
              "'(cd rust && cargo run --release --example wggw-reference)'," \
              "then commit the result."
            exit 1
          fi
