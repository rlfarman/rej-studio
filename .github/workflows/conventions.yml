name: Conventions

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-title:
    name: PR Title (Conventional Commits)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  commitlint:
    name: Commitlint
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: $/.github/actions/setup
      - name: Lint the PR's commits
        # The repo's own commitlint and config (same as the commit-msg hook),
        # instead of an action that bundles its own commitlint version.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  branch-name:
    name: Branch Name (Conventional Branch)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Validate branch name
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          # Bot branches follow their own naming; the GitHub ruleset exempts them.
          case "$BRANCH" in
            dependabot/*|release-please--*)
              echo "Bot branch '$BRANCH' — skipping."
              exit 0
              ;;
          esac
          # Same types as the "Conventional branch naming" ruleset and
          # .husky/pre-push; keep the three in sync.
          pattern='^(main|master|develop|staging|(feat|feature|fix|bugfix|hotfix|release|chore|claude)/[a-z0-9._/-]+)$'
          if ! echo "$BRANCH" | grep -Eq "$pattern"; then
            echo "::warning::Branch '$BRANCH' does not follow Conventional Branch naming."
            echo "Expected: main | master | develop | staging, or <type>/<description>"
            echo "Types: feat, feature, fix, bugfix, hotfix, release, chore, claude"
            echo "See: https://conventional-branch.github.io/"
            exit 0
          fi
          echo "Branch '$BRANCH' ✓"
