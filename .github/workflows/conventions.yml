name: Conventions

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-title:
    name: PR Title (Conventional Commits)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: amannn/action-semantic-pull-request@e32d7e603df1aa1ba07e981f2a23455dee596825 # v5.5.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  commitlint:
    name: Commitlint
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
        with:
          failOnWarnings: false
          failOnErrors: false

  branch-name:
    name: Branch Name (Conventional Branch)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: deepakputhraya/action-branch-name@e0f8db53a8e289f1ae6f6c3e8dc70a3d366fd876 # v1.0.0
        with:
          regex: '^(main|master|develop|staging|(feature|bugfix|hotfix|release|chore|claude)/[a-z0-9._/-]+)$'
          allowed_prefixes: 'feature,bugfix,hotfix,release,chore,claude'
          ignore: main,master,develop,staging
          min_length: 3
