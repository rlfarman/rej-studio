name: Conventions

# Disabled: these three jobs are advisory (continue-on-error + failOnErrors:
# false + exit 0) but GitHub still surfaces each one as a failed check in the
# PR UI when the underlying action errors out — noisy with no actionable
# signal for the author. Conventional commit/branch enforcement already runs
# locally via husky + commitlint hooks, so nothing real is lost by turning
# this workflow off. Keep the file so we can re-enable by restoring the
# `pull_request` trigger if the upstream actions stabilize.
on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-title:
    name: PR Title (Conventional Commits)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: amannn/action-semantic-pull-request@e32d7e603df1aa1ba07e981f2a23455dee596825 # v5.5.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  commitlint:
    name: Commitlint
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
        with:
          failOnWarnings: false
          failOnErrors: false

  branch-name:
    name: Branch Name (Conventional Branch)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Validate branch name
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          pattern='^(main|master|develop|staging|(feature|bugfix|hotfix|release|chore|claude)/[a-z0-9._/-]+)$'
          if ! echo "$BRANCH" | grep -Eq "$pattern"; then
            echo "::warning::Branch '$BRANCH' does not follow Conventional Branch naming."
            echo "Expected: main | master | develop | staging, or <type>/<description>"
            echo "Types: feature, bugfix, hotfix, release, chore, claude"
            echo "See: https://conventional-branch.github.io/"
            exit 0
          fi
          echo "Branch '$BRANCH' ✓"
