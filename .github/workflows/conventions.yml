name: Conventions

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-title:
    name: PR Title (Conventional Commits)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  commitlint:
    name: Commitlint
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
        with:
          failOnWarnings: false
          failOnErrors: false

  branch-name:
    name: Branch Name (Conventional Branch)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Validate branch name
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          pattern='^(main|master|develop|staging|(feature|bugfix|hotfix|release|chore|claude)/[a-z0-9._/-]+)$'
          if ! echo "$BRANCH" | grep -Eq "$pattern"; then
            echo "::warning::Branch '$BRANCH' does not follow Conventional Branch naming."
            echo "Expected: main | master | develop | staging, or <type>/<description>"
            echo "Types: feature, bugfix, hotfix, release, chore, claude"
            echo "See: https://conventional-branch.github.io/"
            exit 0
          fi
          echo "Branch '$BRANCH' ✓"
