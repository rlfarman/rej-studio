name: Lock-File Policy

on:
  pull_request:

permissions:
  contents: read

# Catches sneaky transitive-dep swaps: if pnpm-lock.yaml changes without a
# corresponding package.json change, flag for review. Dependabot-authored
# PRs are exempt (they legitimately bump lockfiles for security advisories).
jobs:
  check:
    name: Lockfile drift
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify lockfile changes pair with manifest changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          lockfile_changed=false
          manifest_changed=false
          echo "$changed" | grep -qx 'pnpm-lock.yaml' && lockfile_changed=true || true
          # Overrides and build allowlists live in pnpm-workspace.yaml (pnpm 11+
          # no longer reads the "pnpm" field in package.json), so it counts too.
          echo "$changed" | grep -qxE 'package.json|pnpm-workspace.yaml' && manifest_changed=true || true
          if [ "$lockfile_changed" = "true" ] && [ "$manifest_changed" = "false" ]; then
            echo "::error::pnpm-lock.yaml changed but neither package.json nor pnpm-workspace.yaml did."
            echo "::error::This usually means a transitive dep was swapped without updating manifests."
            echo "::error::If intentional (e.g. bumping a vulnerable transitive), add a note in the PR body."
            exit 1
          fi
          echo "Lockfile/manifest pairing OK."
