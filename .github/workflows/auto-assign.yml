name: Auto-assign

# pull_request_target so fork PRs get a token that can assign. Safe here: the
# job never checks out or runs PR code; it only reads the PR's author.
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, reopened, ready_for_review]

permissions:
  pull-requests: write

jobs:
  assign-author:
    name: Assign PR author
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Assign the PR author as assignee
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo
            const prNumber = context.payload.pull_request.number
            const author = context.payload.pull_request.user.login

            // Skip bots (dependabot, renovate, release-please, etc.)
            if (context.payload.pull_request.user.type === 'Bot') return

            await github.rest.issues.addAssignees({
              owner,
              repo,
              issue_number: prNumber,
              assignees: [author],
            })
