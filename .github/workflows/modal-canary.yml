name: Modal Canary Deploy

# Deploys the Python backend to a separate Modal "canary" environment for
# smoke-testing before promoting to production. Triggered manually or on PRs
# that touch Python/Modal code.

on:
  pull_request:
    paths:
      - 'python/**'
      - 'modal/**'
  workflow_dispatch:
    inputs:
      promote:
        description: 'Promote canary to production after deploy?'
        type: boolean
        default: false

concurrency:
  group: modal-canary-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  canary:
    name: Deploy Canary
    runs-on: ubuntu-latest
    environment: canary
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: python/requirements.txt

      - name: Install Modal
        run: pip install modal

      - name: Deploy to canary environment
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          GIT_SHA: ${{ github.sha }}
          MODAL_ENVIRONMENT: canary
        run: modal deploy --env canary modal/app.py

      - name: Smoke test
        env:
          CANARY_URL: ${{ secrets.MODAL_CANARY_URL }}
        run: |
          set -euo pipefail
          if [ -z "${CANARY_URL:-}" ]; then
            echo "MODAL_CANARY_URL not set — skipping smoke test"
            exit 0
          fi
          # Check the canary endpoint responds
          status=$(curl -s -o /dev/null -w '%{http_code}' "${CANARY_URL}/docs" --max-time 30)
          if [ "$status" -lt 200 ] || [ "$status" -ge 400 ]; then
            echo "Canary health check failed: HTTP $status"
            exit 1
          fi
          echo "Canary is healthy (HTTP $status)"

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body "**Modal canary deployed** for commit \`${GITHUB_SHA:0:7}\`. Canary environment is ready for testing."

  promote:
    name: Promote to Production
    needs: canary
    if: github.event.inputs.promote == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: python/requirements.txt

      - name: Install Modal
        run: pip install modal

      - name: Deploy to production
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          GIT_SHA: ${{ github.sha }}
        run: modal deploy modal/app.py
