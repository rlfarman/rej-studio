name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      db: ${{ steps.filter.outputs.db }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - '!(**/*.md|docs/**|LICENSE|.github/ISSUE_TEMPLATE/**|.editorconfig)'
            db:
              - 'src/drizzle/**'
              - 'scripts/migrate-db.ts'
              - 'drizzle.config.ts'

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm lint

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm format:check

  knip:
    name: Knip
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm knip

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm type-check

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test:coverage
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          retention-days: 7
      - name: Upload to Codecov
        if: always()
        uses: codecov/codecov-action@18283e04ce6e62d37312384ff67231eb8fd56d24 # v5.4.3
        with:
          files: coverage/lcov.info
          flags: typescript
          fail_ci_if_error: false
      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY=$(node scripts/comment-coverage.mjs)
          gh pr comment "${{ github.event.pull_request.number }}" --body "$BODY" || true

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Chromium only; the suite is a smoke test, not a browser matrix.
      - run: pnpm exec playwright install --with-deps chromium
      # Starts `next dev` with the gate on and in-memory sample data
      # (see playwright.config.ts); needs no secrets or database.
      - run: pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    outputs:
      bundle-delta: ${{ steps.budget.outputs.delta }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          # The build never queries the database (every DB-backed route
          # renders at request time), so CI gets an unreachable placeholder
          # instead of production credentials. env.ts only checks the scheme.
          DATABASE_URL: postgres://ci:ci@127.0.0.1:1/ci
          # Required by env.ts production validation but not exercised in CI.
          COMPUTE_BACKEND: modal
          MODAL_API_URL: https://placeholder.modal.run
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
      - name: Enforce bundle-size budget
        id: budget
        # Sums all First-Load JS chunks in .next/static/chunks/ and fails if
        # the total exceeds BUDGET_KB. Pure Node — no extra deps needed.
        # Tune BUDGET_KB as the app grows; current value is a ceiling, not
        # a target.
        env:
          BUDGET_KB: '3000'
        run: node scripts/check-bundle-size.mjs

      - name: Record bundle size
        if: github.ref == 'refs/heads/main'
        run: node scripts/record-bundle-size.mjs

      - name: Comment bundle size on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Read base branch bundle size from history file (if it exists)
          BASE_KB=0
          if [ -f bundle-size-history.json ]; then
            BASE_KB=$(node -e "const h=JSON.parse(require('fs').readFileSync('bundle-size-history.json','utf-8'));console.log(h.length?h[h.length-1].totalKB:0)")
          fi
          export BASE_BUNDLE_KB="$BASE_KB"
          BODY=$(node scripts/comment-bundle-size.mjs)
          gh pr comment "${{ github.event.pull_request.number }}" --body "$BODY" || true
