name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # paths-filter lists a PR's files through the API
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - '!(**/*.md|docs/**|LICENSE|.github/ISSUE_TEMPLATE/**|.editorconfig)'

  # Static analysis of the workflows themselves (template injection,
  # credential persistence, unpinned actions, risky triggers). Not
  # path-filtered: it's fast, and a required check has to report on every PR.
  zizmor:
    name: Workflow Security (zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.32.0
          # Annotations on the PR instead of SARIF uploads, which would need
          # security-events: write.
          advanced-security: false
          annotations: true

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      - run: pnpm lint

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      - run: pnpm format:check

  knip:
    name: Knip
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      - run: pnpm knip

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      - run: pnpm type-check

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      - run: pnpm test:coverage
      - name: Upload coverage artifact
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          retention-days: 7
      - name: Write coverage comment
        if: github.event_name == 'pull_request' && (success() || failure())
        run: |
          mkdir -p "$RUNNER_TEMP/pr-comment"
          node scripts/comment-coverage.mjs > "$RUNNER_TEMP/pr-comment/coverage.md"
      - name: Upload coverage comment
        if: github.event_name == 'pull_request' && (success() || failure())
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-comment-coverage
          path: ${{ runner.temp }}/pr-comment/coverage.md
          retention-days: 1

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      # Chromium only; the suite is a smoke test, not a browser matrix.
      - run: pnpm exec playwright install --with-deps chromium
      # Starts the TanStack Start dev server (`vp dev`, the Worker in
      # workerd; see playwright.config.ts). Needs no secrets.
      - run: pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      # TanStack Start + Cloudflare plugin: the client bundle, the Worker and
      # the prerendered SPA shell. Needs no secrets.
      - run: pnpm build

      # The server routes in the real Workers runtime: starts `wrangler dev`
      # on the build output and exercises /api/health, /api/version and
      # /api/mcp over HTTP, including a real inline design. Needs the build,
      # so it runs here rather than in the Test job, and needs no secrets or
      # Cloudflare account (`wrangler dev --local`).
      - run: pnpm test:worker

      # Bundle budgets: per-route first-load JS (gzip) from the build's
      # client chunk graph (dist/client-chunks.json). Each main build caches
      # its stats under its SHA; a PR compares against its base commit's.
      - name: Restore main's bundle stats
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bundle-stats/base.json
          key: bundle-stats-${{ github.event.pull_request.base.sha }}
          # A newer push can cancel main's build for the base commit, so fall
          # back to the newest stats main saved (the comment names its SHA).
          restore-keys: bundle-stats-
      - name: Check bundle budgets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          node scripts/bundle-size.mjs
          --base "$RUNNER_TEMP/bundle-stats/base.json"
          --out "$RUNNER_TEMP/bundle-stats/current.json"
          --markdown "$RUNNER_TEMP/pr-comment/bundle-size.md"
      - name: Upload bundle-size comment
        if: github.event_name == 'pull_request' && (success() || failure())
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-comment-bundle-size
          path: ${{ runner.temp }}/pr-comment/bundle-size.md
          retention-days: 1
      - name: Keep stats as main's baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cp "$RUNNER_TEMP/bundle-stats/current.json" "$RUNNER_TEMP/bundle-stats/base.json"
      - name: Save main's bundle stats
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bundle-stats/base.json
          key: bundle-stats-${{ github.sha }}

  # Builds every story in test mode (no docs, no sourcemaps), so a story
  # that no longer compiles against the components fails here.
  storybook:
    name: Storybook
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      - run: pnpm build-storybook --test -o "$RUNNER_TEMP/storybook-static"

  # Posts the coverage and bundle-size reports the jobs above leave as
  # artifacts. The only job with a write token, and it runs no repo code.
  pr-comments:
    name: PR Comments
    runs-on: ubuntu-latest
    needs: [changes, test, build]
    # Also after failures: an over-budget build is when the comment matters.
    if: always() && github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pr-comment-*
          path: ${{ runner.temp }}/pr-comment
          merge-multiple: true
      - name: Post or update comments
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for file in "$RUNNER_TEMP"/pr-comment/*.md; do
            [ -s "$file" ] || continue
            # Each body starts with a hidden marker line; edit the earlier
            # comment that has it rather than adding one per push.
            MARKER=$(head -n1 "$file")
            export MARKER
            id=$(gh api --paginate "repos/$GH_REPO/issues/$PR_NUMBER/comments" \
              --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith(env.MARKER))) | .id' | head -n1)
            if [ -n "$id" ]; then
              gh api -X PATCH "repos/$GH_REPO/issues/comments/$id" -F "body=@$file" > /dev/null
            else
              # Fork PRs get a read-only token, so this can't post there.
              gh api -X POST "repos/$GH_REPO/issues/$PR_NUMBER/comments" -F "body=@$file" > /dev/null \
                || echo "::warning::Could not comment on the PR (read-only token on fork PRs)."
            fi
          done
