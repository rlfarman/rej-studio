name: DB CI

on:
  pull_request:
    paths:
      - 'src/drizzle/**'
      - 'scripts/migrate-db.ts'
      - 'scripts/load-db.ts'
      - 'drizzle.config.ts'
      - '.github/workflows/db-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/drizzle/**'
      - 'scripts/migrate-db.ts'
      - 'drizzle.config.ts'
      - '.github/workflows/db-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Push the schema to an in-memory PGlite instance, run the migration
  # runner, and verify the resulting schema matches `schema.ts`.
  # Catches cases where someone edits schema.ts without running db:generate,
  # or where a migration file drifts from the schema.
  schema-drift:
    name: Schema drift + migrations
    runs-on: ubuntu-latest
    env:
      # Use PGlite (embedded WASM Postgres) instead of a service container.
      # Faster startup, no docker overhead, full PostgreSQL compatibility.
      # File-based so drizzle-kit push and verify-schema.ts share the same DB.
      DATABASE_URL: 'file:./data/ci.db'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: mkdir -p data

      - name: Apply migrations
        # Uses drizzle-kit's `push` against PGlite. Same code path as
        # `pnpm db:push` that contributors run locally.
        run: pnpm drizzle-kit push --force

      - name: Check for generated-migration drift
        # If schema.ts changed without a matching generate, drizzle will
        # refuse to no-op and ask for a new migration file.
        run: |
          set -e
          output=$(pnpm drizzle-kit generate --name=drift-check 2>&1 || true)
          echo "$output"
          # "No schema changes" means we're in sync.
          if ! echo "$output" | grep -q "No schema changes"; then
            echo "::error::schema.ts drifted from migrations. Run \`pnpm db:generate\` and commit the new migration file."
            exit 1
          fi

      - name: Schema constraint tests
        # Asserts FK + unique constraints are actually enforced by the DB
        # (not just declared in schema.ts). Belt-and-braces: the schema
        # file claims a FK, the DB confirms it.
        run: pnpm tsx scripts/verify-schema.ts
