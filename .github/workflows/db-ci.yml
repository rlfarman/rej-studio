name: DB CI

# Runs on every PR and filters by path inside the workflow: a workflow skipped
# by an `on.paths` filter leaves a required check pending forever, while a
# job skipped by `if:` reports success.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect DB Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # paths-filter lists a PR's files through the API
    outputs:
      db: ${{ steps.filter.outputs.db }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            db:
              - 'src/drizzle/**'
              - 'scripts/migrate-db.ts'
              - 'scripts/load-db.ts'
              - 'scripts/verify-schema.ts'
              - 'drizzle.config.ts'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/db-ci.yml'

  # Apply the committed migrations to a fresh PGlite database, check that
  # schema.ts has no changes missing a migration, and verify the constraints
  # the schema declares are enforced. Catches schema.ts edits without
  # `pnpm db:generate`, and migrations that don't apply cleanly.
  schema-drift:
    name: Schema drift + migrations
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.db == 'true'
    env:
      # Use PGlite (embedded WASM Postgres) instead of a service container.
      # Faster startup, no docker overhead, full PostgreSQL compatibility.
      # File-based so the migration runner and verify-schema.ts share the same DB.
      DATABASE_URL: 'file:./data/ci.db'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      - run: mkdir -p data

      - name: Apply migrations
        # The committed SQL in src/drizzle/migrations, applied the same way
        # as on a real database (`pnpm db:migrate`). `drizzle-kit push`
        # would diff schema.ts instead and never run the migration files.
        run: pnpm db:migrate

      - name: Check for generated-migration drift
        # If schema.ts changed without a matching generate, drizzle will
        # refuse to no-op and ask for a new migration file.
        run: |
          set -e
          output=$(pnpm db:generate --name=drift-check 2>&1 || true)
          echo "$output"
          # "No schema changes" means we're in sync.
          if ! echo "$output" | grep -q "No schema changes"; then
            echo "::error::schema.ts drifted from migrations. Run \`pnpm db:generate\` and commit the new migration file."
            exit 1
          fi

      - name: Schema constraint tests
        # Asserts FK + unique constraints are actually enforced by the DB
        # (not just declared in schema.ts). Belt-and-braces: the schema
        # file claims a FK, the DB confirms it. The react-server condition
        # makes `server-only` (imported by src/drizzle/db.ts) resolve to its
        # empty module, as it does in Next's server build.
        run: pnpm tsx --conditions=react-server scripts/verify-schema.ts
