name: Chore / Task
description: Track internal work — refactors, dependency bumps, infra, cleanup
title: 'chore: '
labels: ['chore']
body:
  - type: textarea
    id: task
    attributes:
      label: Task
      description: What needs to be done?
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Why
      description: Motivation or context — why is this worth doing?
    validations:
      required: false

  - type: textarea
    id: checklist
    attributes:
      label: Checklist
      description: Sub-tasks, if applicable.
      value: |
        - [ ]
        - [ ]
    validations:
      required: false
