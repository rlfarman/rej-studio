name: Feature Request
description: Suggest a new feature or enhancement
title: 'feat: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Please describe the problem and the solution you'd like.

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What user need or pain point does this address? Who is affected?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the feature or change you'd like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you've thought about and why they don't fit.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the app would this touch?
      options:
        - Gene search
        - Design tool / optimization
        - Database / seeding
        - Python backend (FastAPI / Modal)
        - UI / styling
        - Build / deploy
        - Other
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Mockups, links, references, or related issues.
    validations:
      required: false
