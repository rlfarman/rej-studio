# pnpm 11+ reads its settings from this file; the "pnpm" field in
# package.json is ignored.

# Dependency install scripts are blocked unless listed here (pnpm 10+).
# esbuild: validates its platform binary. @sentry/cli: fetches the CLI that
# uploads source maps at build time. protobufjs: postinstall only prints a
# version notice, so it stays off.
allowBuilds:
  '@sentry/cli': true
  esbuild: true
  protobufjs: false

# Security pins for transitive dependencies (see the Dependabot alerts that
# prompted them) plus the typescript-eslint/@types alignment.
overrides:
  '@types/react': '$@types/react'
  '@types/react-dom': '$@types/react-dom'
  'typescript-eslint>typescript': '$typescript'
  'protobufjs': '^7.6.1'
  '@grpc/grpc-js@^1.0.0': '^1.14.5'
  'brace-expansion@^1.0.0': '^1.1.20'
  'brace-expansion@^2.0.0': '^2.1.6'
  'brace-expansion@^5.0.0': '^5.0.11'
  'browserslist@^4.0.0': '^4.28.7'
  'fast-uri@^3.0.0': '^3.1.7'
  'js-yaml@^4.0.0': '^4.3.2'
  'shell-quote@^1.0.0': '^1.9.0'
  'smol-toml@^1.0.0': '^1.7.1'
  'source-map-js@^1.0.0': '^1.2.2'
  'ws@^7.0.0': '^7.5.11'
