# pnpm 11+ reads its settings from this file; the "pnpm" field in
# package.json is ignored.

# Dependency install scripts are blocked unless listed here (pnpm 10+).
# esbuild: validates its platform binary. workerd: downloads the Cloudflare
# Workers runtime binary that wrangler and the Cloudflare Vite plugin run.
allowBuilds:
  esbuild: true
  workerd: true

# Refuse a package version with weaker publish trust evidence (trusted
# publisher > provenance > none) than an earlier release of the same package,
# the usual sign of a hijacked maintainer account. Checked when resolving and,
# by default, against every lockfile entry on install. Exempt specific
# versions with trustPolicyExclude (name@version selectors) only after
# checking why the evidence dropped.
trustPolicy: no-downgrade

# Versions shared by package.json and the overrides below, so a transitive
# copy (e.g. @types/react pulled in by a library) always matches the
# direct dependency.
catalog:
  typescript: ^6.0.2
  '@types/react': ^19.2.14
  '@types/react-dom': ^19.2.3

# Security pins for transitive dependencies (see the Dependabot alerts that
# prompted them) plus the @types alignment.
overrides:
  # Vite+ (vp): every package that imports `vite` or `vitest` must get the
  # copies vp runs, or identity checks across two Vite instances break
  # (TanStack Start 404s) and Vitest's mocks/expect split. Keep the core
  # version equal to vite-plus and vitest equal to `vp toolchain vitest`.
  'vite@*': 'npm:@voidzero-dev/vite-plus-core@1.6.0'
  'vitest@*': '5.1.0'
  '@types/react': 'catalog:'
  '@types/react-dom': 'catalog:'
  'brace-expansion@^1.0.0': '^1.1.20'
  'brace-expansion@^2.0.0': '^2.1.6'
  'brace-expansion@^5.0.0': '^5.0.11'
  'browserslist@^4.0.0': '^4.28.7'
  'fast-uri@^3.0.0': '^3.1.7'
  'js-yaml@^4.0.0': '^4.3.2'
  'shell-quote@^1.0.0': '^1.9.0'
  'smol-toml@^1.0.0': '^1.7.1'
  'source-map-js@^1.0.0': '^1.2.2'

minimumReleaseAgeExclude:
  - '@oxfmt/binding-android-arm-eabi@0.79.0'
  - '@oxfmt/binding-android-arm64@0.79.0'
  - '@oxfmt/binding-darwin-arm64@0.79.0'
  - '@oxfmt/binding-darwin-x64@0.79.0'
  - '@oxfmt/binding-freebsd-x64@0.79.0'
  - '@oxfmt/binding-linux-arm-gnueabihf@0.79.0'
  - '@oxfmt/binding-linux-arm-musleabihf@0.79.0'
  - '@oxfmt/binding-linux-arm64-gnu@0.79.0'
  - '@oxfmt/binding-linux-arm64-musl@0.79.0'
  - '@oxfmt/binding-linux-ppc64-gnu@0.79.0'
  - '@oxfmt/binding-linux-riscv64-gnu@0.79.0'
  - '@oxfmt/binding-linux-riscv64-musl@0.79.0'
  - '@oxfmt/binding-linux-s390x-gnu@0.79.0'
  - '@oxfmt/binding-linux-x64-gnu@0.79.0'
  - '@oxfmt/binding-linux-x64-musl@0.79.0'
  - '@oxfmt/binding-openharmony-arm64@0.79.0'
  - '@oxfmt/binding-win32-arm64-msvc@0.79.0'
  - '@oxfmt/binding-win32-ia32-msvc@0.79.0'
  - '@oxfmt/binding-win32-x64-msvc@0.79.0'
  - oxfmt@0.79.0
