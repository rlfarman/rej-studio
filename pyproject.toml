# Python backend: the optimizer API (python/index.py) for local dev and the
# Modal app (modal/app.py) in production. Dependencies are managed with uv:
#   uv sync              # runtime + dev tools into .venv
#   uv run pytest        # run anything inside that environment
#   uv add <pkg>         # add a dependency and update uv.lock
# uv.lock pins every package (transitive ones included). Modal builds its
# image from the same lock (Image.uv_sync), so production only changes when
# the lock does.

[project]
name = "rej-studio-optimizer"
version = "0.0.0"
description = "DNA optimization backend for REJ Studio (FastAPI + DNA Chisel)"
# Python 3.14 everywhere: here, .python-version, the Modal image (built with
# image builder 2026.10, pinned in modal-deploy.yml) and CI.
requires-python = ">=3.14,<3.15"
dependencies = [
    # Web API. The [standard] extra is what Modal web endpoints expect, and it
    # brings uvicorn for the local dev server.
    "fastapi[standard]>=0.163.1",
    "pydantic>=2.14.3",
    "uvicorn>=0.54.0",
    # Optimization engine (algorithm.py imports proglog directly)
    "dnachisel>=3.2.16",
    "proglog>=0.1.12",
    # Error reporting on Modal; a no-op unless SENTRY_DSN is set
    "sentry-sdk[fastapi]>=2.75.0",
    # Tracing; a no-op unless OTEL_EXPORTER_OTLP_ENDPOINT is set
    "opentelemetry-api>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    # Security floor (form-parsing advisories in earlier releases)
    "python-multipart>=0.0.26",
]

[dependency-groups]
# Lint/format, types and tests. Installed by default with `uv sync`; never in
# the Modal image (app.py passes --no-dev).
dev = [
    "ruff>=0.17.5",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-timeout>=2.4.0",
    "pytest-cov>=7.1.0",
]
# Modal client for `modal deploy modal/app.py` and for type-checking app.py.
# Not installed in the image: Modal supplies its own client in containers.
deploy = [
    "modal>=1.6.4",
]

[tool.uv]
# This is an application, not a distributable package: `uv sync` installs
# the dependencies only.
package = false

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["venv", ".venv", "scripts/build-db.py"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line length — handled by ruff format
    "B008",  # do not perform function calls in argument defaults (FastAPI Depends)
]

[tool.ruff.lint.per-file-ignores]
"modal/app.py" = ["E402"]  # imports inside functions are intentional (Modal image isolation)

[tool.pyright]
include = ["python", "modal"]
exclude = ["venv", ".venv", "**/__pycache__"]
pythonVersion = "3.14"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
# uv's project environment
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["."]
addopts = "--cov=python --cov-report=term --cov-report=lcov:coverage/python-lcov.info"

[tool.coverage.run]
source = ["python"]
omit = ["python/tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
