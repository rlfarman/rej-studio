[package]
name = "rej-optimizer"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "RNA End-Joining sequence design optimizer (port of python/algorithm.py)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"

[dev-dependencies]
serde_json = "1.0.145"
