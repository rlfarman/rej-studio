[package]
name = "rej-optimizer"
version = "0.1.0"
edition = "2024"
# The project's Clear BSD License, plus the licenses of the code ported into
# this crate: DNAChisel (MIT) and NumPy's MT19937 (BSD-3-Clause, with MIT
# terms for rk_interval). THIRD-PARTY-NOTICES.md says which files are which.
license = "BSD-3-Clause-Clear AND MIT AND BSD-3-Clause"
description = "RNA End-Joining sequence design optimizer (port of python/algorithm.py)"
# Shipped as a .wasm asset, never to crates.io. Also lets cargo-deny skip
# license checks on this crate itself (deny.toml: licenses.private).
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"

[dev-dependencies]
serde_json = "1.0.145"
