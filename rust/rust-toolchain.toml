# The one place the Rust version is set. rustup reads this for every cargo
# command run under rust/ (including scripts/build-optimizer-wasm.sh), and CI
# installs from it, so local builds and CI use the same compiler.
#
# Bump the channel in its own PR and fix any new lints there. A bump changes
# what the optimizer compiles to, so it also needs `pnpm wasm:build` and the
# rebuilt asset committed — Rust CI fails the PR until it is.
#
# rust-analyzer is deliberately not listed: pinning it would hold editors
# back to this release's language server.
[toolchain]
channel = "1.100.0"
components = ["clippy", "rustfmt"]
targets = ["wasm32-unknown-unknown"]
profile = "minimal"
